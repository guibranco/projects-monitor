version: 2

updates:
- package-ecosystem: "docker"
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 50
  assignees: 
    - "guibranco"
  reviewers: 
    - "guibranco"
  labels:
    - "docker"
    - "dependencies"

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 50
  assignees: 
    - "guibranco"
  reviewers: 
    - "guibranco"
  labels:
    - "github-actions"
    - "dependencies"
  ignore:
    # GitTools/actions v5+ requires GitVersion 7.x; deploy.yml pins versionSpec 6.x.
    - dependency-name: "gittools/actions"
      update-types: ["version-update:semver-major"]

- package-ecosystem: "composer"
  directory: "/Src"
  schedule:
    interval: weekly
  open-pull-requests-limit: 50
  assignees: 
    - "guibranco"
  reviewers: 
    - "guibranco"
  labels:
    - "php"
    - "composer"
    - "dependencies"
