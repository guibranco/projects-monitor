<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Projects Monitor">
  <defs>
    <linearGradient id="pm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1e2e"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="pm-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b35"/>
      <stop offset="1" stop-color="#f7931e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#pm-bg)"/>
  <!-- gauge ring: 270° arc open at the bottom -->
  <path d="M157 382 A168 168 0 1 1 355 382" fill="none" stroke="url(#pm-ring)" stroke-width="38" stroke-linecap="round"/>
  <!-- activity pulse -->
  <polyline points="140,272 198,272 228,190 270,350 304,236 326,272 372,272" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- status light -->
  <circle cx="256" cy="420" r="30" fill="#3fb950"/>
</svg>
