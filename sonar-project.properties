sonar.organization=guibranco
sonar.projectKey=guibranco_projects-monitor

sonar.sources=Src
sonar.tests=Tests/UnitTests
sonar.exclusions=Src/vendor/**,Src/cache/**,Src/secrets/**
sonar.php.coverage.reportPaths=coverage.xml

# Front-end JS (Src/static) has no test runner; only PHP is covered (PHPUnit -> coverage.xml).
# Still analysed for bugs/smells, just excluded from coverage so every JS change doesn't read 0%.
sonar.coverage.exclusions=Src/static/**
